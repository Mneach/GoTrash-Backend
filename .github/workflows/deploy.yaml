name: GoTrash-Backend Deployment

on:
  push:
    branches:
      - feature/**
      - release/**
    tags:
      - 'v*'

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set Environment
        run: echo "RELEASE_VERSION=v0.0.10" >> $GITHUB_ENV

      - name: Check Release Version
        run : |
          echo $RELEASE_VERSION
          echo ${{ env.RELEASE_VERSION }}

      - name: Build Jar
        run: |
          ./gradlew clean bootJar
          JAR_FILE=$(ls build/libs/*.jar | head -n 1)
          cp "$JAR_FILE" "${RELEASE_VERSION}.jar"
          echo "JAR_NAME=${RELEASE_VERSION}.jar" >> $GITHUB_ENV
          echo "[INFO] Copied $JAR_FILE to ${RELEASE_VERSION}.jar"
      
      - name: Upload JAR to VPS
        uses: appleboy/scp-action@v0.1.3
        with:
          host : ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_KEY }}
          source: ${{ env.JAR_NAME }}
          target: ${{ vars.JAR_DEPLOYMENT_FOLDER }}

      - name: Trigger Deploy
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_KEY }}
          script: |
            cd ${{ vars.SCRIPT_DEPLOYMENT_FOLDER }}
            ./deploy.sh ${{ env.JAR_NAME }}