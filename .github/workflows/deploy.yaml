name: GoTrash-Backend Deployment

on:
  push:
    branches:
      - feature/**
      - release/**
    tags:
      - 'v*'

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set Environment
        run: echo "RELEASE_VERSION=${GITHUB_REF#refs/*/}" >> $GITHUB_ENV

      - name: Check Release Version
        run : |
          echo $RELEASE_VERSION
          echo ${{ env.RELEASE_VERSION }}

      - name: Build Jar
        run: |
          ./gradlew clean build
          mkdir app
          cp build/libs/*.jar app/${{ env.JAR_NAME }}
      
      - name: Upload JAR to VPS
        uses: appleboy/scp-action@v0.1.3
        with:
          host : ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_KEY }}
          source: app/${{ env.JAR_NAME }}
          target: ${{ env.JAR_DEPLOYMENT_FOLDER }}
          debug: true  # Enable debug logs

      - name: Trigger Deploy
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_KEY }}
          script: |
            whoami
            cd ${{ env.SCRIPT_DEPLOYMENT_FOLDER }}
            ls -la
            ./deploy.sh ${{ env.JAR_NAME }}
