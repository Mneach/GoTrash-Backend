server:
    port: 8080

spring:
  application:
      name: gotrash-backend
  datasource:
      url: jdbc:postgresql://localhost:5432/gotrash
      username: application
      password: application
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate.dialect: org.hibernate.dialect.PostgreSQLDialect

management:
  endpoints:
    web:
      base-path: /
      exposure:
        include: health, info
  endpoint:
    health:
      show-details: always