services:

  postgres:
    image: postgres:16
    container_name: postgres
    restart: always
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: application
      POSTGRES_PASSWORD: application
      POSTGRES_DB: gotrash
    volumes:
      - ./scripts/dump:/docker-entrypoint-initdb.d:ro
    networks:
      default:
        ipv4_address: 192.168.201.10

  java-app:
    container_name: gotrash-backend
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: ${SPRING_DATASOURCE_URL}
      SPRING_DATASOURCE_USERNAME: ${SPRING_DATASOURCE_USERNAME}
      SPRING_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      JWT_EXPIRATION: ${JWT_EXPIRATION}
      FRONTEND_ORIGINS: ${FRONTEND_ORIGINS}
      FILE_UPLOAD_BASE_DIR: ${FILE_UPLOAD_BASE_DIR}
      FILE_UPLOAD_BASE_URL: ${FILE_UPLOAD_BASE_URL}
    depends_on:
      - postgres
    networks:
      default:
        ipv4_address: 192.168.201.11

networks:
  default:
    name: gotrash_network
    driver: bridge
    ipam:
      config:
        - subnet: 192.168.201.0/26